
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh yêu em Điệp yêu Chi 💗</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Segoe UI", sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at center, #ffb8df 0%, #f66cbd 35%,
    #a52d9d 68%, #270d49 100%);
  perspective: 1000px;
}

.scene {
  position: relative;
  width: min(92vw, 700px);
  text-align: center;
  transform-style: preserve-3d;
  animation: float 5s ease-in-out infinite;
}

h1 {
  font-size: clamp(28px, 6vw, 52px);
  line-height: 1.25;
  margin-bottom: 12px;
  color: #fff;
  text-shadow:
    0 2px #ff68b7,
    0 5px #c82e93,
    0 12px 20px #6c075c,
    0 0 35px #fff;
  animation: glow 2s ease-in-out infinite alternate;
}

.subtitle {
  font-size: 17px;
  text-shadow: 0 0 12px #ffdaf0;
}

.heart {
  display: inline-block;
  font-size: 65px;
  filter: drop-shadow(0 0 22px #ff007f);
  animation: heartbeat 1.2s infinite;
}

.envelope-area {
  margin: 40px auto 15px;
  height: 190px;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 800px;
}

.envelope {
  width: 250px;
  height: 155px;
  position: relative;
  cursor: pointer;
  transform-style: preserve-3d;
  filter: drop-shadow(0 18px 25px #6c075c);
  transition: transform .6s;
}

.envelope:hover {
  transform: translateY(-8px) rotateX(8deg);
}

.base {
  position: absolute;
  inset: 0;
  background: linear-gradient(145deg, #ffb9e2, #ff4db1);
  border-radius: 8px;
  z-index: 2;
  overflow: hidden;
}

.base::before, .base::after {
  content: "";
  position: absolute;
  bottom: 0;
  width: 0;
  height: 0;
  border-style: solid;
}

.base::before {
  left: 0;
  border-width: 0 0 155px 125px;
  border-color: transparent transparent #ff8bcf transparent;
}

.base::after {
  right: 0;
  border-width: 155px 0 0 125px;
  border-color: transparent transparent transparent #ff70c3;
}

.flap {
  position: absolute;
  inset: 0;
  z-index: 4;
  transform-origin: top center;
  transform: rotateX(0deg);
  transition: transform .8s;
  backface-visibility: visible;
}

.flap::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 125px solid transparent;
  border-right: 125px solid transparent;
  border-top: 95px solid #ffdaf0;
  filter: drop-shadow(0 3px 3px #d52c91);
}

.seal {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 48%;
  transform: translate(-50%, -50%);
  font-size: 32px;
  transition: opacity .3s;
}

.letter {
  position: absolute;
  z-index: 1;
  left: 10px;
  right: 10px;
  top: 10px;
  height: 130px;
  padding: 16px 8px;
  color: #b01676;
  background: linear-gradient(#fff8fc, #ffd9ee);
  border-radius: 8px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  transition: transform .8s, z-index .1s .4s;
  box-shadow: 0 0 20px #ffb2de;
}

.letter p {
  margin: 5px;
}

.letter .joke {
  font-size: 17px;
}

.envelope.open .flap {
  transform: rotateX(180deg);
  z-index: 0;
}

.envelope.open .seal {
  opacity: 0;
}

.envelope.open .letter {
  transform: translateY(-115px) scale(1.12);
  z-index: 6;
  transition: transform .8s .3s, z-index 0s .3s;
}

.hint {
  margin-top: 24px;
  font-size: 14px;
  opacity: .95;
  animation: glow 1.5s infinite alternate;
}

button {
  border: 1px solid #fff;
  color: #b01676;
  background: linear-gradient(135deg, white, #ffc4e6);
  border-radius: 50px;
  padding: 13px 24px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 25px #ff8bd0;
  transition: .25s;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 0 35px white;
}

.heart-particle {
  position: fixed;
  bottom: -40px;
  pointer-events: none;
  animation: rise linear forwards;
  filter: drop-shadow(0 0 8px #fff);
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotateY(-3deg); }
  50% { transform: translateY(-12px) rotateY(3deg); }
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

@keyframes glow {
  from { filter: brightness(1); }
  to { filter: brightness(1.25); }
}

@keyframes rise {
  to { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
}

@media (max-width: 480px) {
  .envelope-area { margin-top: 35px; }
  .subtitle { font-size: 14px; }
}
</style>
</head>
<body>

<main class="scene">
  <div class="heart">💗</div>
  <h1>ANH YÊU EM<br>ĐIỆP YÊU CHI</h1>
  <p class="subtitle">
    Em là vũ trụ màu hồng của anh ✨
  </p>

  <div class="envelope-area">
    <div class="envelope" id="envelope"
         role="button" tabindex="0"
         aria-label="Mở phong thư tình yêu">
      <div class="base"></div>
      <div class="letter">
        <p>💌 BÍ MẬT DÀNH CHO CHI 💌</p>
        <p class="joke">CÓ CÁI ĐẦU BUỒI 🍆😂</p>
        <p>Anh đùa đó, yêu Chi nhiều! 💗</p>
      </div>
      <div class="flap"></div>
      <div class="seal">💖</div>
    </div>
  </div>

  <button id="openButton">💌 Mở thư tình</button>
  <p class="hint">✨ Bấm vào phong thư để khám phá bí mật ✨</p>
</main>

<script>
const envelope = document.getElementById("envelope");
const openButton = document.getElementById("openButton");

function toggleLetter() {
  const isOpen = envelope.classList.toggle("open");
  openButton.textContent = isOpen
    ? "💗 Đóng thư lại"
    : "💌 Mở thư tình";
}

envelope.addEventListener("click", toggleLetter);
envelope.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    toggleLetter();
  }
});
openButton.addEventListener("click", toggleLetter);

const symbols = ["💗", "💕", "💖", "💘", "✨"];

function createParticle() {
  const particle = document.createElement("span");
  particle.className = "heart-particle";
  particle.textContent =
    symbols[Math.floor(Math.random() * symbols.length)];
  particle.style.left = Math.random() * 100 + "vw";
  particle.style.fontSize = 14 + Math.random() * 25 + "px";
  particle.style.animationDuration = 5 + Math.random() * 6 + "s";
  document.body.appendChild(particle);
  setTimeout(() => particle.remove(), 11000);
}

setInterval(createParticle, 350);
</script>

</body>
</html>
